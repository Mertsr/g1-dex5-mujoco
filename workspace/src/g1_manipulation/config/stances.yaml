# Named stances for scripts/go_to_stance.py: where base_footprint stands (x, y, m) and which way
# it faces (yaw_deg, about z from the frame's +x), in `frame`. Stances saved with
# `go_to_stance.py --save NAME` go to ~/.ros/g1_stances.yaml and take precedence over these.
#
# In the simulator with odometry:=sportmodestate (the default), odom is the MuJoCo world, so these
# are world coordinates of the scene.
stances:
  # conveyor_flat, the first panel (part_tray_1 at rest at 1.595, -0.800, its edge grasp at
  # 1.55, -0.915): checked against move_group with the full collision model (KDL, the real
  # meshes) over a grid of stances, the band where the pick went through in two hands every time
  # is the pelvis 0.47 m behind the grasp, facing 0 to +10 degrees, anywhere from y -0.90 to -0.70.
  # Its middle: 32 cm back from the table's edge. 4 cm nearer or further back it was hit and miss
  # (the arm folds into the torso at the scoop's start nearer; out of reach further).
  panel_1: {x: 1.08, y: -0.80, yaw_deg: 5.0, frame: odom}

  # conveyor_fixed, the pallet route (left hand). The first panel picked in the LEFT hand at its
  # usual scoop (scoop_left_near; Pick arm "left", hands 1): the pelvis 10 cm to the right of
  # panel_1, facing the tray square -- the same heading as pallet_end_left, so the panel is held
  # turned as the nests are and the hand barely turns to set it down (2 degrees; turned 10
  # degrees here, 12).
  panel_1_left: {x: 1.06, y: -0.90, yaw_deg: 0.0, frame: odom}

  # In front of the pallet at the belt's start (the pallet held there until it is full, see
  # make_conveyor_fixed_scene.py), facing along the belt: the two nests nearest the robot, nest_4
  # and nest_3, from here without moving. A panel seated in a nest lies across the belt with the
  # edge the scoop holds facing the belt's start, as it lies on the tray facing the robot -- so
  # the hand comes at it the same way. Checked with move_group's IK on the URDF over a grid of
  # stances (both nests and 8 cm above each, no self-collision): this is the middle of the stances
  # that reach both; 5 cm nearer, the hand could not slide fully out from under the set-down panel
  # (the arm folds back too far). Raise the panel first (SetArmPosture left_arm raise_14), so it
  # comes in over the rails and a panel already seated in nest_4.
  pallet_end_left: {x: -0.50, y: 0.42, yaw_deg: 0.0, frame: odom}
  # nest_3 with the thumb-under scoop (scoop_thumb_left_near): 15 cm further along the belt than
  # pallet_end_left, the nests' spacing, so the hand meets nest_3 as it meets nest_4 from there.
  # From pallet_end_left itself nest_3 is out of reach with either scoop (the shoulder's yaw at
  # its limit palm up, out of reach palm down).
  pallet_nest3_left: {x: -0.35, y: 0.42, yaw_deg: 0.0, frame: odom}

  # On the way to pallet_end_left: beside the belt's start, clear of its near corner (the leg at
  # x -0.15, y 0.26). go_to_stance.py walks straight, so going from the tray to pallet_end_left
  # directly would cut that corner; from here the last 0.4 m is a short sidestep with the panel
  # (carried at 0.92 m) passing over the near rail (0.85).
  pallet_approach_left: {x: -0.65, y: 0.00, yaw_deg: 0.0, frame: odom}

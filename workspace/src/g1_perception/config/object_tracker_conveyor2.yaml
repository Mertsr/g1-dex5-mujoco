# The model-based tracker for world:=conveyor2 (g1_bringup/mjcf/g1_conveyor2_scene.xml): the
# conveyor world with the BSH panels replaced by an upright cylinder, 45 mm across and 104.6 mm
# tall (written by g1_bringup/tools/make_conveyor2_scene.py, which also writes this config's
# model, models/cylinder.stl). Everything but the part is object_tracker_conveyor.yaml unchanged.
# bringup.launch.py picks this file by default when world:=conveyor2.
#
# Pose strings: "<frame> x y z [roll pitch yaw]" (metres, radians, RPY about fixed axes as in
# ROS), where <frame> is a TF frame or another tracked object's name. See README.md.
g1_object_tracker:
  ros__parameters:
    # The simulator's half-resolution depth (424x240, 0.4 MB a frame): the tracker fits ~3000
    # points a frame either way, and the full image is four times the DDS traffic. On the robot,
    # point these at the RealSense's aligned depth (or run it at 424x240).
    depth_topic: /camera/depth_half/image_raw
    info_topic: /camera/depth_half/camera_info
    # 16UC1 depth (a real RealSense) is multiplied by this to get metres; 32FC1 is metres already.
    depth_scale: 0.001
    # Poses are carried here between frames, so the head's motion is not mistaken for the
    # parts'. Fixed, not on the robot.
    world_frame: odom
    # What g1_object_pose_source's depth_tracker source expects detections in.
    output_frame: camera_color_optical_frame
    # tracked/<name> frames under world_frame, for RViz. Off: a part that stops being tracked
    # leaves frames that go stale, and move_group's planning scene monitor warns about every one
    # of them on each update. The debug markers (~/debug/markers) show the same poses.
    publish_tf: false

    # Fitted in this order, and each one's surface is removed from the depth before the next
    # is fitted: the pallet first, so a part standing in a nest is not fitted to the pallet.
    objects: ["pallet", "cylinder"]

    pallet:
      # Swap in the scanned PLY here (model_scale 0.001 if it is in millimetres). Its frame must
      # be the one the priors below are written for.
      model: package://g1_perception/models/bsh_pallet.stl
      model_scale: 1.0
      # Where the pallet sits at index 0: its station on the line, in odom. In the simulator odom
      # starts at the world origin, so this is the scene's conveyor_pallet body. ON THE ROBOT
      # this is the line's position in your map, so use the map frame here (and run
      # localization), or update it whenever odom is reset.
      priors: ["odom 0.1741 0.6 0.762 0 0 0"]
      # The pallet indexes along its line, so where it is along x is unknown at start-up: try
      # the station prior every 25 mm over the travel (0.75 m in the scene).
      prior_sweep: "x 0.0 0.75 0.025"
      # Reported pose = model pose * this. The sim body frame IS this model's frame.
      output_offset: "0 0 0"
      # Where the pallet can be: on its line, anywhere along its travel, level and square to it
      # (5 degrees). A fit anywhere else -- the tray, the floor, a rail -- is dropped and the
      # pallet searched for again, never reported. Same caveat as the prior: odom here is the
      # simulator's; on the robot write it in map.
      region: "odom 0.10 1.00 0.57 0.63 0.74 0.79 5"
      # Where the part's BODY frame sits when placed in each nest, in the pallet's frame. Published
      # as pallet/slot/nest_<k> on /objects; Place with surface_object_id "pallet/slot/nest_2"
      # puts the held cylinder exactly there.
      slots:
        # The cylinder standing on the pallet plate (top z 0.01) at each nest's centre, between
        # its end cradles: origin half its height above the plate (pallet z 0.0622), inside the
        # nest site the simulator's conveyor handler watches, so a placed part indexes the
        # pallet. Measured by dropping the part into nest 1 in the simulator; the others are the
        # nest sites' x.
        - "nest_1  0.2259 0.0 0.0622 0 0 0"
        - "nest_2  0.0753 0.0 0.0622 0 0 0"
        - "nest_3  -0.0753 0.0 0.0622 0 0 0"
        - "nest_4  -0.2259 0.0 0.0622 0 0 0"

    cylinder:
      model: package://g1_perception/models/cylinder.stl
      model_scale: 1.0
      instances: 4
      prior_jitter: "0.02 0.2"
      # The tray's part_tray_1..4 as they rest (standing on the floor, top z 0.71; origin at the
      # centre, 52.3 mm up), then the four nests relative to the tracked pallet. Measured by
      # settling the scene. The model's frame IS the body frame, so no output offset. Turned
      # about its axis the cylinder looks the same, so the yaw the tracker reports is arbitrary;
      # the grasps below cover every yaw for that reason.
      priors:
        - "odom 1.605 -0.80 0.7622 0 0 0"
        - "odom 1.755 -0.80 0.7622 0 0 0"
        - "odom 1.905 -0.80 0.7622 0 0 0"
        - "odom 2.055 -0.80 0.7622 0 0 0"
        - "pallet 0.2259 0.0 0.0622 0 0 0"
        - "pallet 0.0753 0.0 0.0622 0 0 0"
        - "pallet -0.0753 0.0 0.0622 0 0 0"
        - "pallet -0.2259 0.0 0.0622 0 0 0"
      output_offset: "0 0 0"
      # top_<deg>: from straight above, on the axis, pinched across the diameter 25 mm below the
      # top face (body z +0.0273), the thumb toward body yaw <deg>. Pinch frame as usual: x along
      # the fingers (straight down), thumb toward +y. Eight yaws because the reported yaw means
      # nothing for a cylinder: Pick tries them all (and its tilts and leans of each) and plans
      # to whichever the arm reaches; at the tray, the ones closing along the tray's y keep the
      # fingers off the stop bars between the parts.
      #
      # The hand goes down in g1.srdf's "top_open" (Pick takes "<grasp>_open" when the hand has
      # it): pinch_open's 3.7 cm across would land on the 45 mm top face. Checked in MuJoCo for
      # both hands: top_open passes over the part, and "closed" pinches it between thumb and
      # index/middle at the height above.
      grasps:
        - "top_000  0.0 0.0 0.0273  1.5708 1.5708 0.0"
        - "top_045  0.0 0.0 0.0273  0.7854 1.5708 0.0"
        - "top_090  0.0 0.0 0.0273  0.0 1.5708 0.0"
        - "top_135  0.0 0.0 0.0273  -0.7854 1.5708 0.0"
        - "top_180  0.0 0.0 0.0273  -1.5708 1.5708 0.0"
        - "top_225  0.0 0.0 0.0273  -2.3562 1.5708 0.0"
        - "top_270  0.0 0.0 0.0273  3.1416 1.5708 0.0"
        - "top_315  0.0 0.0 0.0273  2.3562 1.5708 0.0"

    # Shared by every object.
    tracking:
      max_points: 3000        # ICP input per object per frame
      min_ratio: 0.55         # scene points in the part's box that lie on it
      min_coverage: 0.25      # visible model surface the depth confirms (a hand may cover some)
      max_violation: 0.12     # visible model surface the camera sees PAST: it cannot be there
      lost_after: 5           # bad frames in a row before searching again
      global_after_s: 1.0     # priors alone this long, then FPFH over the whole frame as well
      z_max: 3.0
    model:
      voxel: 0.003            # model sample spacing
